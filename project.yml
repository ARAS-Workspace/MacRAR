name: MacRAR
options:
  bundleIdPrefix: com.arasworkspace
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:

  # ── Main App ──────────────────────────────────────────────

  MacRAR:
    type: application
    platform: macOS
    sources:
      - path: MacRAR
        excludes:
          - "**/.DS_Store"
          - Localization/translations
          - AppIcon.icon
      - path: MacRAR/Localization/translations
        type: folder
        buildPhase: resources
      # Icon Composer package — xcodegen does not know the .icon
      # bundle, so it must enter the project as a single file or its
      # contents get flattened into loose resources.
      - path: MacRAR/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - framework: Libraries/SevenZipKit/lib7zip_apple.a
        embed: false
    postCompileScripts:
      # The licences travel with every copy of the app, byte for byte: the
      # MIT notice of its own code (LICENSE), the third-party notices
      # (THIRD_PARTY_LICENSES), 7-Zip's licence (as 7zip-license.txt, the
      # name it has had since 1.4) and the GNU LGPL 2.1 text that 7-Zip's
      # licence refers to, which the LGPL asks a binary distribution to
      # supply. Two of the files are named LICENSE, so they are copied by a
      # step rather than added as resources.
      - name: Copy the licences
        script: |
          set -eu
          cp "${SCRIPT_INPUT_FILE_0}" "${SCRIPT_OUTPUT_FILE_0}"
          cp "${SCRIPT_INPUT_FILE_1}" "${SCRIPT_OUTPUT_FILE_1}"
          cp "${SCRIPT_INPUT_FILE_2}" "${SCRIPT_OUTPUT_FILE_2}"
          cp "${SCRIPT_INPUT_FILE_3}" "${SCRIPT_OUTPUT_FILE_3}"
        inputFiles:
          - $(SRCROOT)/LICENSE
          - $(SRCROOT)/THIRD_PARTY_LICENSES
          - $(SRCROOT)/Libraries/SevenZipKit/LICENSE
          - $(SRCROOT)/Libraries/SevenZipKit/copying.txt
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/LICENSE
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/THIRD_PARTY_LICENSES
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/7zip-license.txt
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/lgpl-2.1.txt
      # Finder names the archive kinds the app declares in the user's
      # language: InfoPlist.strings for each language, written from the
      # kind_* texts in translations/<language>.json, so that the Turkish
      # stays in tr.json alone. A .strings file may be a property list.
      - name: Localize the archive kinds
        script: |
          set -eu
          for language in en tr; do
            json="${SRCROOT}/MacRAR/Localization/translations/${language}.json"
            folder="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/${language}.lproj"
            strings="${folder}/InfoPlist.strings"
            # Read before written: a missing or empty text stops the build instead of naming a kind ""
            rar_archive=$(plutil -extract kind_rar_archive raw -o - "${json}")
            rar_volume=$(plutil -extract kind_rar_volume raw -o - "${json}")
            archive=$(plutil -extract kind_archive raw -o - "${json}")
            : "${rar_archive:?kind_rar_archive is empty in ${json}}" "${rar_volume:?kind_rar_volume is empty in ${json}}" \
              "${archive:?kind_archive is empty in ${json}}"
            mkdir -p "${folder}"
            plutil -create binary1 "${strings}"
            plutil -insert "RAR Archive" -string "${rar_archive}" "${strings}"
            plutil -insert "RAR Volume" -string "${rar_volume}" "${strings}"
            plutil -insert "Archive" -string "${archive}" "${strings}"
          done
        inputFiles:
          - $(SRCROOT)/MacRAR/Localization/translations/en.json
          - $(SRCROOT)/MacRAR/Localization/translations/tr.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/en.lproj/InfoPlist.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/tr.lproj/InfoPlist.strings
    settings:
      base:
        ARCHS: "$(ARCHS_STANDARD)"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_BRIDGING_HEADER: MacRAR/BridgingHeader.h
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Libraries/SevenZipKit/include"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Libraries/SevenZipKit"
        OTHER_LDFLAGS:
          - "-lc++"
        PRODUCT_NAME: MacRAR
        PRODUCT_BUNDLE_IDENTIFIER: com.arasworkspace.MacRAR
        INFOPLIST_FILE: MacRAR/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacRAR/MacRAR.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: GZUHTM7439
        SWIFT_VERSION: "5.0"
        # The original developer's release this build is based on, and the
        # ARAS patch round on top of it: 1.4.2+ARAS.Patch.<n>.
        MARKETING_VERSION: "1.4.2"
        DISTRIBUTION_PATCH: 6
        CURRENT_PROJECT_VERSION: 7
      configs:
        Debug:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    info:
      path: MacRAR/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: MacRAR
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ARASDistributionVersion: "$(MARKETING_VERSION)+ARAS.Patch.$(DISTRIBUTION_PATCH)"
        CFBundleLocalizations:
          - en
          - tr
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 Mesut Çevik · github.com/mstcvk/MacRAR"
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: RAR Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.rarlab.rar-archive
              - com.arasworkspace.MacRAR.rar-volume
          - CFBundleTypeName: Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - org.7-zip.7-zip-archive
              - public.tar-archive
              - org.gnu.gnu-zip-archive
              - org.gnu.gnu-zip-tar-archive
              - public.bzip2-archive
              - org.tukaani.xz-archive
              - public.archive
              - com.arasworkspace.MacRAR.archive
              - com.microsoft.cab-archive
              - public.iso-image
              - com.sun.java-archive
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.rarlab.rar-archive
            UTTypeDescription: RAR Archive
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - rar
              public.mime-type:
                - application/vnd.rar
                - application/x-rar-compressed
          # An old-style set is name.rar, then name.r00 to name.r99. The
          # volumes are a type of the app's own: LaunchServices takes one
          # app's declaration of com.rarlab.rar-archive, often another
          # archiver's, which may name only rar.
          - UTTypeIdentifier: com.arasworkspace.MacRAR.rar-volume
            UTTypeDescription: RAR Volume
            UTTypeConformsTo:
              - com.rarlab.rar-archive
              - public.archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension: [
                  r00, r01, r02, r03, r04, r05, r06, r07, r08, r09,
                  r10, r11, r12, r13, r14, r15, r16, r17, r18, r19,
                  r20, r21, r22, r23, r24, r25, r26, r27, r28, r29,
                  r30, r31, r32, r33, r34, r35, r36, r37, r38, r39,
                  r40, r41, r42, r43, r44, r45, r46, r47, r48, r49,
                  r50, r51, r52, r53, r54, r55, r56, r57, r58, r59,
                  r60, r61, r62, r63, r64, r65, r66, r67, r68, r69,
                  r70, r71, r72, r73, r74, r75, r76, r77, r78, r79,
                  r80, r81, r82, r83, r84, r85, r86, r87, r88, r89,
                  r90, r91, r92, r93, r94, r95, r96, r97, r98, r99
                ]
          - UTTypeIdentifier: com.arasworkspace.MacRAR.archive
            UTTypeDescription: Archive
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - 7z
                - zst
                - tzst
                - lz4
                - lzma
                - tlz
                - cab
                - arj
                - lzh
                - lha
                - cpio
                - wim
                - swm
                - esd
                - deb
                - rpm
                - xar
                - zipx
                - "001"
                - tbz
                - tbz2
                - txz
                - tgz
                - br
                - uue
                - squashfs
                - cramfs
                - vhd
                - vhdx
                - vmdk
                - qcow2
                - chm
                - msi
                - nupkg
    entitlements:
      path: MacRAR/MacRAR.entitlements
      properties:
        # Developer ID distribution outside the Mac App Store. The
        # Finder Quick Actions are written to ~/Library/Services and
        # RAR creation runs the user's own RARLAB `rar`, neither of
        # which the sandbox permits.
        com.apple.security.app-sandbox: false

  # ── Tests ─────────────────────────────────────────────────

  MacRARTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacRARTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: MacRAR
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacRAR.app/Contents/MacOS/MacRAR"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.arasworkspace.MacRARTests
        # @testable import MacRAR reads the app's bridging header
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Libraries/SevenZipKit/include"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: GZUHTM7439
        SWIFT_VERSION: "5.0"

# ── Scheme ────────────────────────────────────────────────

# A project scheme rather than the target's: XcodeGen gives a target
# scheme's variables to the run, test and profile actions alike, and
# MACRAR_DEBUG_UNSEEN belongs to the test action alone. It keeps every
# window the test host opens unseen, from its launch on; the app run
# from Xcode shows its windows.
schemes:
  MacRAR:
    build:
      targets:
        MacRAR: all
    run:
      environmentVariables:
        MACRAR_NO_UPDATE_CHECK: "1"
    test:
      targets:
        - name: MacRARTests
          parallelizable: false
      environmentVariables:
        MACRAR_NO_UPDATE_CHECK: "1"
        MACRAR_DEBUG_UNSEEN: "1"
    profile:
      environmentVariables:
        MACRAR_NO_UPDATE_CHECK: "1"
