name: MacRAR
options:
  bundleIdPrefix: com.arasworkspace
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:

  # ── Main App ──────────────────────────────────────────────

  MacRAR:
    type: application
    platform: macOS
    sources:
      - path: MacRAR
        excludes:
          - "**/.DS_Store"
          - Localization/translations
          - AppIcon.icon
      - path: MacRAR/Localization/translations
        type: folder
        buildPhase: resources
      # Icon Composer package — xcodegen does not know the .icon
      # bundle, so it must enter the project as a single file or its
      # contents get flattened into loose resources.
      - path: MacRAR/AppIcon.icon
        type: file
        buildPhase: resources
    scheme:
      testTargets:
        - MacRARTests
      environmentVariables:
        MACRAR_NO_UPDATE_CHECK: "1"
    dependencies:
      - framework: Libraries/SevenZipKit/lib7zip_apple.a
        embed: false
    postCompileScripts:
      # The LGPL asks a binary distribution of 7-Zip to carry its licence;
      # it is copied into the resources as 7zip-license.txt, as in 1.4.
      - name: Copy 7-Zip licence
        script: cp "${SRCROOT}/Libraries/SevenZipKit/LICENSE" "${SCRIPT_OUTPUT_FILE_0}"
        inputFiles:
          - $(SRCROOT)/Libraries/SevenZipKit/LICENSE
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/7zip-license.txt
    settings:
      base:
        ARCHS: "$(ARCHS_STANDARD)"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_BRIDGING_HEADER: MacRAR/BridgingHeader.h
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Libraries/SevenZipKit/include"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Libraries/SevenZipKit"
        OTHER_LDFLAGS:
          - "-lc++"
        PRODUCT_NAME: MacRAR
        PRODUCT_BUNDLE_IDENTIFIER: com.arasworkspace.MacRAR
        INFOPLIST_FILE: MacRAR/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacRAR/MacRAR.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: GZUHTM7439
        SWIFT_VERSION: "5.0"
        # The original developer's release this build is based on, and the
        # ARAS patch round on top of it: 1.4.2+ARAS.Patch.<n>.
        MARKETING_VERSION: "1.4.2"
        DISTRIBUTION_PATCH: 2
        CURRENT_PROJECT_VERSION: 7
      configs:
        Debug:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    info:
      path: MacRAR/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: MacRAR
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ARASDistributionVersion: "$(MARKETING_VERSION)+ARAS.Patch.$(DISTRIBUTION_PATCH)"
        CFBundleLocalizations:
          - en
          - tr
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 Mesut Çevik · github.com/mstcvk/MacRAR"
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: RAR Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.rarlab.rar-archive
          - CFBundleTypeName: Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - org.7-zip.7-zip-archive
              - public.tar-archive
              - org.gnu.gnu-zip-archive
              - org.gnu.gnu-zip-tar-archive
              - public.bzip2-archive
              - org.tukaani.xz-archive
              - public.archive
              - com.arasworkspace.MacRAR.archive
              - com.microsoft.cab-archive
              - public.iso-image
              - com.sun.java-archive
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.rarlab.rar-archive
            UTTypeDescription: RAR Archive
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - rar
                - r00
                - r01
                - r02
                - r03
              public.mime-type:
                - application/vnd.rar
                - application/x-rar-compressed
          - UTTypeIdentifier: com.arasworkspace.MacRAR.archive
            UTTypeDescription: Archive
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - 7z
                - zst
                - tzst
                - lz4
                - lzma
                - tlz
                - cab
                - arj
                - lzh
                - lha
                - cpio
                - wim
                - swm
                - esd
                - deb
                - rpm
                - xar
                - zipx
                - "001"
                - tbz
                - tbz2
                - txz
                - tgz
                - br
                - uue
                - squashfs
                - cramfs
                - vhd
                - vhdx
                - vmdk
                - qcow2
                - chm
                - msi
                - nupkg
    entitlements:
      path: MacRAR/MacRAR.entitlements
      properties:
        # Developer ID distribution outside the Mac App Store. The
        # Finder Quick Actions are written to ~/Library/Services and
        # RAR creation runs the user's own RARLAB `rar`, neither of
        # which the sandbox permits.
        com.apple.security.app-sandbox: false

  # ── Tests ─────────────────────────────────────────────────

  MacRARTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacRARTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: MacRAR
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacRAR.app/Contents/MacOS/MacRAR"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.arasworkspace.MacRARTests
        # @testable import MacRAR reads the app's bridging header
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Libraries/SevenZipKit/include"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: GZUHTM7439
        SWIFT_VERSION: "5.0"
